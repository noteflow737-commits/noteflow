<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteFlow Dashboard</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

h1{
  text-align:center;
  color:#2563eb;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-top:15px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  background:#1d4ed8;
  transform:translateY(-2px);
}

.section-title{
  margin-top:25px;
  margin-bottom:10px;
  color:#1e293b;
}
</style>

</head>
<body>

<div class="container">
  <h1>NoteFlow Dashboard</h1>

  <div class="card">

    <div class="section-title"><h2>Class 8</h2></div>
    <div class="grid">
      <button>A1</button>
      <button>A2</button>
      <button>A3</button>
    </div>

    <div class="section-title"><h2>Class 9</h2></div>
    <div class="grid">
      <button>Science 1</button>
      <button>Science 2</button>
      <button>Commerce</button>
    </div>

    <div class="section-title"><h2>Class 10</h2></div>
    <div class="grid">
      <button>Science 1</button>
      <button>Science 2</button>
      <button>Commerce</button>
    </div>

  </div>
</div>

</body>
</html>
